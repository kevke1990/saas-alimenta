name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alimenta_test
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PRIVACY_HASH_SALT: ci-privacy-salt
      POSTMARK_INBOUND_SECRET: ci-inbound-secret
      AI_PROCESSING_DISABLED: "true"
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alimenta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alimenta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/package.json') }}-
            ${{ runner.os }}-next-
      - name: Install dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
