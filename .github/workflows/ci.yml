name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/alimenta_test
      SESSION_SECRET: ci-session-secret-0123456789abcdef
      APP_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PRIVACY_HASH_SALT: ci-privacy-salt
      POSTMARK_INBOUND_SECRET: ci-inbound-secret
      AI_PROCESSING_DISABLED: "true"
      PRISMA_HIDE_UPDATE_MESSAGE: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alimenta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d alimenta_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('**/package.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', 'next.config.ts') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('**/package.json') }}-
            ${{ runner.os }}-next-
      - name: Verify repository hygiene
        run: |
          set -eu
          if git ls-files | grep -E '(^|/)\.env(\.production|\.local|\.development)$'; then
            echo "Tracked production/local environment file detected. Remove it from Git."
            exit 1
          fi
          test -f prisma/migrations/migration_lock.toml
          migration_count=$(find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql | wc -l)
          test "$migration_count" -gt 0
          echo "Verified $migration_count Prisma migration files."
      - name: Install dependencies
        run: npm install
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Run tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Runtime health smoke test
        run: |
          set -eu
          npm run start > /tmp/alimenta-next.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              echo
              echo "Runtime health check passed."
              exit 0
            fi
            sleep 2
          done
          echo "Runtime health check failed. Server log:"
          cat /tmp/alimenta-next.log
          exit 1
      - name: Runtime readiness smoke test
        run: |
          set -eu
          curl --fail --silent http://127.0.0.1:3000/api/ready >/tmp/alimenta-ready.json
          cat /tmp/alimenta-ready.json
      - name: Validate production Compose
        run: |
          set -eu
          test -f Dockerfile
          test -f docker-compose.prod.yml
          test -f deploy/.env.production.example
          cp deploy/.env.production.example .env.production
          sed -i \
            -e 's#CHANGE-ME#ci-change-me#g' \
            -e 's#GENERATE-A-LONG-RANDOM-PASSWORD#ci-postgres-password#g' \
            -e 's#GENERATE-A-LONG-RANDOM-SECRET#ci-session-secret-0123456789abcdef#g' \
            -e 's#USE-A-LONG-UNIQUE-PASSWORD#ci-admin-password#g' \
            -e 's#change-this-to-a-long-random-secret#ci-privacy-salt-long-enough#g' \
            -e 's#jouwdomein.nl#staging.example.test#g' \
            -e 's#admin@example.nl#admin@staging.example.test#g' \
            -e 's#https://app.staging.example.nl#https://staging.example.test#g' \
            -e 's#APP_ENCRYPTION_KEY="ci-session-secret-0123456789abcdef"#APP_ENCRYPTION_KEY="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"#g' \
            -e 's#POSTMARK_INBOUND_SECRET="ci-change-me-LONG-RANDOM-SECRET"#POSTMARK_INBOUND_SECRET="ci-inbound-secret-long-enough"#g' \
            .env.production
          ./deploy/validate-production-env.sh .env.production
          ln -s .env.production .env
          docker compose -f docker-compose.prod.yml config >/tmp/alimenta-compose.yml
          grep -q 'no-new-privileges:true' /tmp/alimenta-compose.yml
          grep -q 'cap_drop:' /tmp/alimenta-compose.yml
          grep -q 'read_only: true' /tmp/alimenta-compose.yml
      - name: Build production Docker image
        run: |
          set -eu
          docker build --pull -t alimenta-pro:ci .
      - name: Validate production image user
        run: |
          set -eu
          test "$(docker run --rm --entrypoint id alimenta-pro:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id alimenta-pro:ci -g)" = "1000"
      - name: Validate deployment scripts
        run: |
          set -eu
          for script in deploy/preflight-demo.sh deploy/verify-demo.sh deploy/doctor.sh deploy/backup.sh deploy/restore.sh deploy/verify-backup.sh deploy/update.sh deploy/installer.sh deploy/alimenta deploy/launch-gate.sh deploy/staging-smoke.sh deploy/validate-production-env.sh; do
            test -f "$script"
            bash -n "$script"
          done
          echo "Deployment scripts passed shell syntax validation."

  staging-smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && secrets.STAGING_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run staging smoke test
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          EXPECTED_RELEASE_VERSION: ${{ vars.STAGING_RELEASE_VERSION }}
        run: ./deploy/staging-smoke.sh
