# temporary repair workflow
name: Repair build
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message != 'fix: wrap calculation wizard search params in suspense'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch wizard
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/cases/new/page.tsx')
          s=p.read_text()
          old_import='import Link from "next/link"; import {useEffect,useState} from "react"; import {useSearchParams,useRouter} from "next/navigation";'
          new_import='import Link from "next/link"; import {Suspense, useEffect, useState} from "react"; import {useSearchParams,useRouter} from "next/navigation";'
          if old_import in s: s=s.replace(old_import,new_import)
          old='export default function NewCasePage(){return <Wizard/>;}'
          new='export default function NewCasePage(){return <Suspense fallback={<main className="content"><div className="panel">Berekening wordt geladen…</div></main>}><Wizard/></Suspense>;}'
          if old in s: s=s.replace(old,new)
          if old_import not in s and 'Suspense' not in s: raise SystemExit('wizard import pattern not found')
          if old not in s and 'export default function NewCasePage(){return <Suspense' not in s: raise SystemExit('wizard export pattern not found')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cases/new/page.tsx
          git commit -m "fix: wrap calculation wizard search params in suspense"
          git push
