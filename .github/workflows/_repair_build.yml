name: repair build
on:
  push:
    paths:
      - .github/workflows/_repair_build_trigger
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Repair /cases/new suspense boundary
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/cases/new/page.tsx')
          s=p.read_text()
          s=s.replace('import Link from "next/link"; import {useEffect,useState} from "react"; import {useSearchParams,useRouter} from "next/navigation";', 'import Link from "next/link"; import {Suspense, useEffect, useState} from "react"; import {useSearchParams,useRouter} from "next/navigation";')
          old='export default function NewCasePage(){return <Wizard/>;}'
          new='export default function NewCasePage(){return <Suspense fallback={<main className="content"><div className="panel">Berekening wordt geladen…</div></main>}><Wizard/></Suspense>;}'
          if old not in s:
              raise SystemExit('Expected NewCasePage export not found')
          s=s.replace(old,new)
          p.write_text(s)
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cases/new/page.tsx
          git commit -m "fix: wrap calculation wizard search params in suspense"
          git push
