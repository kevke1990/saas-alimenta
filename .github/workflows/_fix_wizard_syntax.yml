name: fix wizard syntax
on:
  push:
    paths:
      - .github/workflows/_fix_wizard_syntax_trigger
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix missing input parentheses
        shell: python
        run: |
          from pathlib import Path
          p=Path('app/cases/new/page.tsx'); s=p.read_text()
          for key in ['concreteNeedNet','recipientVerdiencapaciteit','recipientOtherIncomeMonthly','recipientAssetsIncomeMonthly','payerOtherMaintenanceObligations','payerPensionProvisionMonthly','payerTaxableIncomeAnnual']:
              s=s.replace(f'{key}:v}}))}}', f'{key}:v}})))}}')
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/cases/new/page.tsx
          git commit -m "fix: repair expanded calculation wizard syntax"
          git push
